      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt Module5CreateRDSSnapshotRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          
          def handler(event, context):
              rds = boto3.client('rds')
              db_instance = event['ResourceProperties']['DBInstanceId']
              snapshot_id = f"{db_instance}-public-snapshot"
              
              if event['RequestType'] == 'Delete':
                  # Clean up the snapshot on stack deletion
                  try:
                      rds.delete_db_snapshot(DBSnapshotIdentifier=snapshot_id)
                      print(f"Deleted snapshot: {snapshot_id}")
                  except Exception as e:
                      print(f"Could not delete snapshot (may not exist): {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              
              try:
                  rds.create_db_snapshot(
                      DBSnapshotIdentifier=snapshot_id,
                      DBInstanceIdentifier=db_instance
                  )
                  
                  waiter = rds.get_waiter('db_snapshot_completed')
                  waiter.wait(
                      DBSnapshotIdentifier=snapshot_id,
                      WaiterConfig={'Delay': 30, 'MaxAttempts': 120}
                  )
                  
                  # Make it public (VULNERABLE)
                  rds.modify_db_snapshot_attribute(
                      DBSnapshotIdentifier=snapshot_id,
                      AttributeName='restore',
                      ValuesToAdd=['all']
                  )
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'SnapshotId': snapshot_id})
              except Exception as e:
                  print(str(e))
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  Module5InvokeSnapshot:
    Type: Custom::CreateSnapshot
    DependsOn: Module5VulnerableRDS
    Properties:
      ServiceToken: !GetAtt Module5CreateRDSSnapshot.Arn
      DBInstanceId: !Ref Module5VulnerableRDS

  # Weak IAM Password Policy
  Module5WeakPasswordPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMFullAccess

  Module5SetWeakPasswordPolicy:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-weak-password"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt Module5WeakPasswordPolicyRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              
              iam = boto3.client('iam')
              try:
                  iam.update_account_password_policy(
                      MinimumPasswordLength=6,
                      RequireSymbols=False,
                      RequireNumbers=False,
                      RequireUppercaseCharacters=False,
                      RequireLowercaseCharacters=False
                  )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  Module5InvokePasswordPolicy:
    Type: Custom::PasswordPolicy
    Properties:
      ServiceToken: !GetAtt Module5SetWeakPasswordPolicy.Arn

# ============================================
# OUTPUTS
# ============================================

Outputs:
  # General
  StackName:
    Description: Stack Name
    Value: !Ref AWS::StackName

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region

  # Networking
  MainVPCId:
    Description: Main VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${EnvironmentName}-main-vpc-id"

  RDSVPCId:
    Description: RDS VPC ID
    Value: !Ref RDSVPC
    Export:
      Name: !Sub "${EnvironmentName}-rds-vpc-id"

  # Attack Simulation
  RedTeamAttackerIP:
    Description: Red Team Attacker Public IP (generates GuardDuty findings)
    Value: !GetAtt AttackerInstance.PublicIp

  VulnerableSSHIP:
    Description: Vulnerable SSH Instance Private IP
    Value: !GetAtt VulnerableSSHInstance.PrivateIp

  # Module 2 - JIT RDS Access
  JITVpcId:
    Description: VPC ID for JIT RDS Access
    Value: !Ref Module5JITVPC
    Export:
      Name: !Sub "${EnvironmentName}-jit-vpc-id"

  JITDBClusterEndpoint:
    Description: Aurora MySQL Cluster Writer Endpoint (for Module 2)
    Value: !GetAtt Module5JITRDSCluster.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-jit-cluster-endpoint"

  JITDBClusterReadEndpoint:
    Description: Aurora MySQL Cluster Reader Endpoint
    Value: !GetAtt Module5JITRDSCluster.ReadEndpoint.Address

  JITDatabaseName:
    Description: Database Name for JIT Access
    Value: workshop_db

  JITAuditLogGroupName:
    Description: CloudWatch Log Group for Audit Logs
    Value: !Ref Module5JITAuditLogGroup

  # Module 4 - Security Hub Vulnerable Resources
  VulnerableEC2Instance:
    Description: Vulnerable EC2 Instance (IMDSv2 not enforced)
    Value: !Ref Module5VulnerableEC2

  PublicS3Bucket:
    Description: Public S3 Bucket (for Security Hub findings)
    Value: !Ref Module5PublicS3Bucket

  VulnerableRDSInstance:
    Description: Vulnerable RDS Instance (publicly accessible)
    Value: !Ref Module5VulnerableRDS

  UnencryptedSQSQueue:
    Description: Unencrypted SQS Queue
    Value: !Ref Module5UnencryptedSQS

  # PostgreSQL (for GuardDuty RDS findings)
  PostgreSQLEndpoint:
    Description: PostgreSQL Endpoint (for GuardDuty RDS findings)
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address

  PostgreSQLSecretArn:
    Description: PostgreSQL Secret ARN
    Value: !Ref PostgreSQLSecret

  # Cleanup Instructions
  CleanupInstructions:
    Description: To delete all resources, delete this CloudFormation stack
    Value: !Sub "aws cloudformation delete-stack --stack-name ${AWS::StackName} --region ${AWS::Region}"

  GuardDutySNSTopicArn:
    Description: GuardDuty SNS Topic ARN for notifications
    Value: !Ref GuardDutySNSTopic
    Export:
      Name: !Sub "${EnvironmentName}-guardduty-sns-topic"

  GuardDutyLogBucket:
    Description: S3 bucket for GuardDuty logs
    Value: !Ref GDLogBucket
  # New AWS Security Hub (V2)
  SecurityHubV2Arn:
    Description: ARN of the new AWS Security Hub (HubV2) resource
    Value: !Ref SecurityHubV2Enable
  SecurityHubV2SubscribedAt:
    Description: Timestamp when the new AWS Security Hub was enabled in this account
    Value: !GetAtt SecurityHubV2Enable.SubscribedAt
  SecurityHubV2ConsoleUrl:
    Description: Console URL for the new AWS Security Hub unified experience
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/securityhub/v2/home?region=${AWS::Region}"
  SecurityHubCspmConsoleUrl:
    Description: Console URL for Security Hub CSPM (posture management, used in Module 5)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/securityhub/home?region=${AWS::Region}"
