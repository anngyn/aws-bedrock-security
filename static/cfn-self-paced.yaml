      DBSubnetGroupName: !Ref RDSDBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: true  # VULNERABLE
      StorageEncrypted: false  # VULNERABLE
      BackupRetentionPeriod: 0
      DeletionProtection: false  # VULNERABLE
