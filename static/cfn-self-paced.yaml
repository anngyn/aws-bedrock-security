  Module5SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Module5VulnerableSubnet

  # S3 Bucket with Public Access Block disabled (for Security Hub S3.1 finding)
  # NOTE: If your account has account-level S3 Block Public Access enabled,
  # this bucket will still be created but won't be publicly accessible.
  # The Security Hub finding will still be generated for the bucket configuration.
  Module5PublicS3Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_18"
            comment: "Module 5 intentionally-public S3 bucket used to teach detection/remediation of public buckets; access logging deliberately omitted for the lesson."
          - id: "CKV_AWS_53"
            comment: "Public access is the intentional vulnerability demonstrated in Module 5 (BlockPublicAcls disabled on purpose)."
          - id: "CKV_AWS_54"
            comment: "Public access is the intentional vulnerability demonstrated in Module 5 (BlockPublicPolicy disabled on purpose)."
          - id: "CKV_AWS_55"
            comment: "Public access is the intentional vulnerability demonstrated in Module 5 (IgnorePublicAcls disabled on purpose)."
          - id: "CKV_AWS_56"
            comment: "Public access is the intentional vulnerability demonstrated in Module 5 (RestrictPublicBuckets disabled on purpose)."
    Properties:
      BucketName: !Sub "${EnvironmentName}-public-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Vulnerability
          Value: S3-Public-Access

  # NOTE: This policy may fail if account-level S3 Block Public Access is enabled.
