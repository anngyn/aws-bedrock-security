  # Public RDS Instance
  Module5VulnerableRDS:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_17"
            comment: "Intentionally public RDS instance; public accessibility is the vulnerability participants detect and remediate in Module 5."
          - id: "CKV_AWS_161"
            comment: "IAM database authentication intentionally omitted on this deliberately-vulnerable Module 5 teaching resource."
